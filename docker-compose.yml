services:
  db:
    image: postgres:17-alpine
    shm_size: 1g
    user: postgres
    restart: always
    healthcheck:
      test: "pg_isready -U user --dbname=postgres"
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5430:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: orbit_dev
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    logging: &default-logging
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  valkey:
    image: valkey/valkey:9.0-alpine
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
      - ./ansible/roles/app/files/valkey.conf:/etc/valkey/valkey.conf
    command: valkey-server /etc/valkey/valkey.conf
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  api:
    build: ./api
    volumes:
      - ./api:/app
      - /app/node_modules
    ports:
      - 3000:3000
    env_file:
      - api/.env.development
    depends_on:
      valkey:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # Logs store — UI at http://localhost:9428/logs/select/vmui/ (loopback only)
  victorialogs:
    image: victoriametrics/victoria-logs:${VICTORIALOGS_TAG:-v1.53.0}
    command:
      - "-storageDataPath=/vlogs"
      - "-http.pathPrefix=/logs"
      - "-retentionPeriod=${VICTORIALOGS_RETENTION:-14d}"
      - "-retention.maxDiskSpaceUsageBytes=${VICTORIALOGS_MAX_DISK:-2GiB}"
    volumes:
      - vlogs_data:/vlogs
    ports:
      - "127.0.0.1:${VICTORIALOGS_PORT:-9428}:9428"
    restart: unless-stopped
    logging: *default-logging

  # Reads container logs through the Docker API and ships them to VictoriaLogs
  # `docker compose logs` keeps working: this does not replace the log driver
  vector:
    image: timberio/vector:${VECTOR_TAG:-0.59.X-distroless-libc}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ansible/roles/app/files/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      - victorialogs
    restart: unless-stopped
    logging: *default-logging

volumes:
  db_data:
  valkey_data:
  vlogs_data:
