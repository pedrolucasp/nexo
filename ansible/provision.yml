---
# ansible/provision.yml
# Full one-time provisioning, in order. Each playbook can also be run alone
# (see the Makefile)
#
# Day-to-day app deploys go through GitHub Actions, NOT these playbooks

- import_playbook: setup.yml
- import_playbook: deploy.yml
- import_playbook: cert.yml
- import_playbook: app.yml
