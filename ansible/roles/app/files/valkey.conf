# Valkey — server config.
#
# Only the directives that differ from the upstream defaults are kept. The
# previous file was the ~125 KB stock example with a handful of edits; that
# whole block of comments adds nothing and makes drift hard to spot.
#
# Valkey is never published outside the Compose network (see the compose file),
# so it is reachable only by the api service — which is why protected-mode can
# be off and no password is set.

bind 0.0.0.0
protected-mode no
port 6379
dir ./

# BullMQ relies on jobs never being evicted, so keep the no-eviction policy.
maxmemory-policy noeviction
