appId: com.eletrotupi.orbit
name: Smoke — Logout
tags:
  - smoke
---
- runFlow:
    file: helpers/_login.yaml
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: button-logout
    direction: DOWN
- tapOn:
    id: button-logout
- assertVisible:
    id: logout-confirm
- tapOn:
    id: logout-confirm-confirm
- extendedWaitUntil:
    visible:
      id: text-welcome
    timeout: 15000
